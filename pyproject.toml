[project]
name = "project-t-workspace"
version = "0.0.1"
description = "Project T monorepo Python workspace configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.20.0",
    "PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/contracts/tests",
    "packages/optimization-core/tests",
    "packages/provider-adapters/tests",
]
pythonpath = [
    ".",
    "packages/contracts/src",
    "packages/optimization-core/src",
    "packages/provider-adapters/src",
]
addopts = "-ra -q"
