name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python workspace dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./packages/contracts"
          pip install -e "./packages/optimization-core"
          pip install -e "./packages/provider-adapters[openai]"
          pip install -e "./apps/local-runtime"
          pip install -e "./apps/api-gateway"
      - name: Verify canonical contract parity
        run: python scripts/verify_contracts.py
      - name: Run Pytest suite
        run: pytest

  typescript-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime for extension integration tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./packages/contracts"
          pip install -e "./packages/optimization-core"
          pip install -e "./packages/provider-adapters[openai]"
          pip install -e "./apps/local-runtime"
          pip install -e "./apps/api-gateway"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack and install pnpm
        run: corepack enable
      - name: Install Node workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Turborepo lint, typecheck, build, and tests
        run: |
          pnpm turbo run lint
          pnpm turbo run typecheck
          pnpm turbo run build
          pnpm turbo run test
      - name: Install Playwright Chromium & run browser extension E2E
        run: |
          pnpm exec playwright install chromium
          pnpm run test:e2e
